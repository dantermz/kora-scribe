<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KORA Scribe · Revisión</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2430; --muted: #6b7684; --line: #e3e7ec;
    --green: #1f8a4c; --green-bg: #e8f6ee; --yellow: #a96b00; --yellow-bg: #fff5dc;
    --red: #c2362f; --red-bg: #fdecea; --blue: #2457c5; --blue-bg: #e9f0fd;
    --doctor: #2457c5; --patient: #7a3fb0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 24px;
           background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .brand { font-weight: 700; font-size: 17px; }
  .brand small { font-weight: 500; color: var(--muted); margin-left: 6px; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .pill.ready { background: var(--green-bg); color: var(--green); }
  .pill.gaps { background: var(--yellow-bg); color: var(--yellow); }
  .pill.revise { background: var(--red-bg); color: var(--red); }
  .counts { color: var(--muted); font-size: 14px; }
  .tagline { margin-left: auto; color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; padding: 20px 24px 40px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .panel h2 { margin: 0 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .section { margin-bottom: 18px; }
  .section h3 { margin: 0 0 6px; font-size: 15px; }
  .section h3 span { color: var(--muted); font-weight: 500; }
  .empty { color: var(--muted); font-style: italic; font-size: 14px; }
  .line { border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; padding: 8px 12px; margin: 6px 0; }
  .line.green { border-left-color: var(--green); }
  .line.yellow { border-left-color: var(--yellow); background: var(--yellow-bg); }
  .line.red { border-left-color: var(--red); background: var(--red-bg); }
  .line { cursor: pointer; transition: box-shadow .15s; }
  .line:hover { box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .line.active { box-shadow: 0 0 0 2px var(--blue); }
  .chip.cite { cursor: pointer; }
  .chip.cite:hover { background: var(--blue-bg); color: var(--blue); }
  .panel.sticky { position: sticky; top: 68px; max-height: calc(100vh - 88px); overflow-y: auto; }
  .turn { transition: background .2s; border-radius: 6px; }
  .turn.hit { background: var(--blue-bg); box-shadow: inset 3px 0 0 var(--blue); }
  .play { border: 0; background: none; cursor: pointer; padding: 0 4px 0 0; font-size: 13px; color: var(--blue); }
  .play:hover { color: var(--ink); }
  .chip.listen { cursor: pointer; background: var(--blue-bg); color: var(--blue); }
  .turn.playing { background: #fff7d6; box-shadow: inset 3px 0 0 var(--yellow); }
  .gap { margin: 6px 0; padding: 8px 12px; border-radius: 8px; background: var(--yellow-bg);
         border: 1px dashed var(--yellow); font-size: 13px; color: #6b4a00; }
  .gap.done { background: #f3f4f6; border-style: solid; border-color: var(--line); color: var(--muted); }
  .gap .title { font-weight: 600; }
  .gap .actions { display: flex; gap: 14px; align-items: center; margin-top: 6px; }
  .gap button { border: 0; background: none; color: var(--blue); cursor: pointer; padding: 0; font: inherit; }
  .gap label { cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .gap.playing { box-shadow: 0 0 0 2px var(--yellow); }
  .banner { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
            background: var(--yellow-bg); color: #6b4a00; }
  .banner.missing { cursor: default; background: var(--red-bg); color: var(--red); }
  .banner.ok { background: var(--green-bg); color: var(--green); cursor: default; }
  .line.added { border-left-color: var(--blue); background: var(--blue-bg); }
  .line.edited { border-left-color: var(--blue); background: #fff; }
  .line.accepted { border-left-color: var(--blue); background: #fff; }
  .line.removed { opacity: .55; background: #fff; }
  .line.removed .body { text-decoration: line-through; }
  .line.editing { cursor: default; box-shadow: 0 0 0 2px var(--blue); background: #fff; }
  .was { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .chip.doc { background: var(--blue-bg); color: var(--blue); }
  .issue.resolved { opacity: .6; text-decoration: line-through; }
  .tools { display: flex; gap: 12px; align-items: center; margin-top: 6px; visibility: hidden; }
  .meta .tools { margin: 0 0 0 auto; }
  .meta { align-items: center; }
  .line:hover .tools, .line.active .tools, .line.editing .tools, .line.red .tools { visibility: visible; }
  .tool { border: 0; background: none; padding: 0; font: inherit; font-size: 13px; color: var(--blue); cursor: pointer; }
  .tool:hover { text-decoration: underline; }
  .tool.danger { color: var(--muted); }
  .tool.primary { background: var(--blue); color: #fff; padding: 3px 12px; border-radius: 6px; }
  .tool.primary:hover { text-decoration: none; opacity: .9; }
  .tool.add { margin-top: 4px; color: var(--muted); }
  .keys { font-size: 12px; color: var(--muted); }
  .editor { width: 100%; margin-top: 6px; padding: 8px; font: inherit; border: 1px solid var(--line);
            border-radius: 6px; resize: vertical; }
  .banner.missing label.ack { display: flex; gap: 6px; align-items: center; margin-top: 6px; cursor: pointer; color: var(--ink); }
  .banner.missing.done { background: #f3f4f6; color: var(--muted); }
  body { padding-bottom: 80px; }
  .signbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 16px; align-items: center;
             justify-content: space-between; flex-wrap: wrap; padding: 12px 24px; background: var(--panel);
             border-top: 1px solid var(--line); box-shadow: 0 -2px 10px rgba(0,0,0,.05); font-size: 14px; }
  .signbar.blocked .why { color: var(--red); }
  .signbar.ready .why { color: var(--green); }
  .signbar .form { display: flex; gap: 8px; }
  .signbar input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; min-width: 260px; }
  .signbar .sign { padding: 7px 18px; border: 0; border-radius: 6px; background: var(--green); color: #fff;
                   font: inherit; font-weight: 600; cursor: pointer; }
  .signbar .sign:disabled { background: #c9d1d9; cursor: not-allowed; }
  .signbar.signed { background: var(--green-bg); color: var(--green); font-weight: 600; display: block; }
  .signbar .hash { font-weight: 400; font-size: 12px; font-family: ui-monospace, Menlo, monospace; margin-top: 2px; }
  .is-signed .line { cursor: default; }
  .hint { color: var(--muted); font-size: 13px; margin: -6px 0 12px; }
  .line .text { display: flex; gap: 8px; align-items: baseline; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .chip { font-size: 12px; padding: 1px 7px; border-radius: 6px; background: #eef1f5; color: var(--muted); }
  .chip.told { background: #f2ebf8; color: var(--patient); }
  .issue { font-size: 13px; margin-top: 4px; }
  .issue.red { color: var(--red); } .issue.yellow { color: var(--yellow); }
  .turn { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .turn:last-child { border-bottom: 0; }
  .who { font-size: 13px; font-weight: 600; }
  .who.doctor { color: var(--doctor); } .who.patient { color: var(--patient); }
  .who small { display: block; font-weight: 400; color: var(--muted); }
  .turn .tid { color: var(--muted); font-size: 12px; margin-right: 4px; }
  footer { padding: 0 24px 30px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="brand">KORA Scribe<small id="case"></small></div>
  <span id="status" class="pill"></span>
  <span id="counts" class="counts"></span>
  <span class="tagline">Documentación, no decisiones · el médico revisa y firma</span>
</header>

<main>
  <section class="panel">
    <h2>Nota SOAP</h2>
    <div id="note"></div>
  </section>
  <section class="panel sticky" id="tpanel">
    <h2>Transcripción</h2>
    <p class="hint">Haz clic en una línea de la nota para ver de qué turnos sale.</p>
    <div id="gapBanner" class="banner" hidden></div>
    <div id="transcript"></div>
  </section>
</main>
<footer>Consulta sintética de prueba. Ningún dato real de pacientes.</footer>
<div id="signbar" class="signbar"></div>

<script>
const SECTIONS = [["S", "Subjetivo"], ["O", "Objetivo"], ["A", "Análisis"], ["P", "Plan"]];
const ICON = { green: "✅", yellow: "🟡", red: "🔴" };
const STATUS = {
  ready_for_signoff: ["Lista para revisión y firma", "ready"],
  review_gaps: ["Revisar audio perdido", "gaps"],
  needs_revision: ["Requiere corrección", "revise"],
};

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function clock(ms) {
  if (ms == null) return "--:--";
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

function speakerNames(turns, clinician) {
  const names = {};
  let others = 0;
  for (const t of turns) {
    if (names[t.speaker]) continue;
    names[t.speaker] = t.speaker === clinician ? "Médico"
      : (others++ === 0 ? "Paciente" : "Acompañante " + others);
  }
  return names;
}

const turnRows = {};
const turnsById = {};
let activeLine = null;
let hasAudio = false;

// ---- Audio: the WAV is fetched once as a blob (Safari needs it for seeking) ----
let player = null, queue = [], current = null, loading = null;

function loadAudio() {
  if (!loading) {
    loading = fetch("audio.wav").then(r => r.blob()).then(blob => {
      player = new Audio(URL.createObjectURL(blob));
      player.addEventListener("timeupdate", () => {
        if (current && player.currentTime * 1000 >= current.end_ms + 250) next();
      });
      player.addEventListener("ended", stopAudio);
    });
  }
  return loading;
}

function markPlaying(item) {
  document.querySelectorAll(".playing").forEach(n => n.classList.remove("playing"));
  const node = item && (item.node || turnRows[item.id]);
  if (node) node.classList.add("playing");
}

function next() {
  current = queue.shift() || null;
  markPlaying(current);
  if (!current) { player.pause(); return; }
  player.currentTime = Math.max(0, current.start_ms - 200) / 1000;
  player.play();
}

function stopAudio() {
  queue = []; current = null; markPlaying(null);
  if (player) player.pause();
}

async function playTurns(ids) {
  stopAudio();
  await loadAudio();
  queue = ids.map(id => turnsById[id]).filter(t => t && t.start_ms != null && t.end_ms != null);
  next();
}

async function playSpan(start_ms, end_ms, node) {
  stopAudio();
  await loadAudio();
  queue = [{ start_ms, end_ms, node }];
  next();
}

// ---- Lost-audio warnings: the clinician has to acknowledge each one before signing ----
const KIND = { unanswered_question: "Pregunta sin respuesta", silence: "Silencio largo" };
const gapAcks = new Set();
const gapChecks = [];
let gapNodes = [];

function updateGapBanner() {
  const banner = document.getElementById("gapBanner");
  if (!gapNodes.length) return;
  banner.hidden = false;
  const left = gapNodes.length - gapAcks.size;
  banner.className = "banner" + (left ? "" : " ok");
  banner.textContent = left
    ? `⚠ ${left} de ${gapNodes.length} avisos de posible audio perdido sin revisar. Clic para ir al primero.`
    : `✓ Avisos de audio revisados (${gapNodes.length}).`;
}

function renderGap(gap, index, turn, nextTurn) {
  const box = el("div", "gap");
  box.appendChild(el("div", "title", "⚠ " + (KIND[gap.kind] || "Posible audio perdido")));
  box.appendChild(el("div", "", gap.reason));
  const actions = el("div", "actions");
  if (hasAudio && turn.end_ms != null) {
    const end = nextTurn && nextTurn.start_ms != null ? nextTurn.start_ms : turn.end_ms + 8000;
    const listen = el("button", "", "▶ Escuchar este tramo");
    listen.addEventListener("click", () => playSpan(turn.end_ms, Math.max(end, turn.end_ms + 3000), box));
    actions.appendChild(listen);
  }
  const label = el("label");
  const check = el("input");
  check.type = "checkbox";
  check.addEventListener("change", () => {
    check.checked ? gapAcks.add(index) : gapAcks.delete(index);
    box.classList.toggle("done", check.checked);
    updateGapBanner();
    renderSignBar();
  });
  gapChecks.push(check);
  label.appendChild(check);
  label.appendChild(el("span", "", "Revisado: no falta nada o ya lo agregué a la nota"));
  actions.appendChild(label);
  box.appendChild(actions);
  return box;
}

document.addEventListener("keydown", e => { if (e.key === "Escape") stopAudio(); });

function select(lineRow, cites, keep) {
  const same = !keep && activeLine === lineRow && cites.length > 1;
  document.querySelectorAll(".turn.hit").forEach(n => n.classList.remove("hit"));
  if (activeLine) activeLine.classList.remove("active");
  activeLine = null;
  if (same) return;  // second click on the same line clears the selection
  activeLine = lineRow;
  lineRow.classList.add("active");
  const rows = cites.map(id => turnRows[id]).filter(Boolean);
  rows.forEach(r => r.classList.add("hit"));
  if (rows.length) {
    const panel = document.getElementById("tpanel");
    const top = panel.scrollTop + rows[0].getBoundingClientRect().top - panel.getBoundingClientRect().top - 60;
    panel.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
  }
}

function renderHeader(c) {
  const v = c.verification;
  document.getElementById("case").textContent = "· " + c.case;
  const [label, cls] = STATUS[v.status] || [v.status, "gaps"];
  const status = document.getElementById("status");
  status.textContent = label;
  status.classList.add(cls);
}

// ---- The note as the clinician leaves it: every change is recorded next to the original ----
let model = [];        // lines with {action: null|"edited"|"accepted"|"removed"|"added", original}
let editing = null;    // id of the line being edited
let addCount = 0;
let caseData = null;
const ACTION_CHIP = { edited: "✎ corregida por el médico", accepted: "✔ aceptada por el médico",
                      removed: "quitada por el médico", added: "＋ agregada por el médico" };

function needsDecision(line) {
  return line.status === "red" && !line.action;
}

function pendingRed() {
  return model.filter(needsDecision).length;
}

function renderCounts() {
  const s = caseData.verification.summary;
  const gaps = (caseData.verification.transcript_gaps || []).length;
  const pending = pendingRed();
  const changed = model.filter(l => l.action).length;
  document.getElementById("counts").textContent =
    `${s.green} ✅ · ${s.yellow} 🟡 · ${s.red} 🔴` + (gaps ? ` · ${gaps} avisos de audio` : "") +
    (pending ? ` · ${pending} 🔴 por resolver` : "") + (changed ? ` · ${changed} cambios del médico` : "");
}

function button(label, cls, fn) {
  const b = el("button", "tool " + (cls || ""), label);
  b.addEventListener("click", e => { e.stopPropagation(); fn(); });
  return b;
}

function setAction(line, action, text) {
  if (action === null) { line.action = line.added ? "added" : null; line.text = line.original; }
  else { line.action = action; if (text !== undefined) line.text = text; }
  editing = null;
  renderNote();
}

function renderEditor(line, row) {
  const area = el("textarea", "editor");
  area.value = line.text;
  area.rows = Math.max(2, Math.ceil(line.text.length / 80));
  const save = () => {
    const value = area.value.trim();
    if (!value) return;
    if (line.added) setAction(line, "added", value);
    else if (value === line.original) setAction(line, null);
    else setAction(line, "edited", value);
  };
  const cancel = () => {
    if (line.added && !line.text) model.splice(model.indexOf(line), 1);
    editing = null;
    renderNote();
  };
  area.addEventListener("click", e => e.stopPropagation());
  area.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) save();
    if (e.key === "Escape") { e.stopPropagation(); cancel(); }
  });
  row.appendChild(area);
  const tools = el("div", "tools");
  tools.appendChild(button("Guardar", "primary", save));
  tools.appendChild(button("Cancelar", "", cancel));
  tools.appendChild(el("span", "keys", "⌘↵ guardar · Esc cancelar"));
  row.appendChild(tools);
  setTimeout(() => { area.focus(); area.setSelectionRange(area.value.length, area.value.length); }, 0);
}

function renderLine(line) {
  const row = el("div", "line " + line.status + (line.action ? " " + line.action : ""));
  if (editing === line.id) {
    row.classList.add("editing");
    if (line.original && line.original !== line.text || line.action === "edited")
      row.appendChild(el("div", "was", "Original: " + line.original));
    renderEditor(line, row);
    return row;
  }
  const text = el("div", "text");
  const icon = line.action === "added" ? "＋" : line.action === "edited" ? "✎" : ICON[line.status];
  text.appendChild(el("span", "", icon));
  text.appendChild(el("span", "body", line.text));
  row.appendChild(text);
  if (line.action === "edited") row.appendChild(el("div", "was", "Decía: " + line.original));

  const meta = el("div", "meta");
  for (const cite of line.cites) {
    const chip = el("span", "chip cite", cite);
    chip.title = "Ver turno " + cite;
    chip.addEventListener("click", e => { e.stopPropagation(); select(row, [cite]); });
    meta.appendChild(chip);
  }
  if (line.cites.length) row.addEventListener("click", () => select(row, line.cites));
  if (hasAudio && line.cites.length) {
    const listen = el("span", "chip listen", "▶ Escuchar");
    listen.title = "Escuchar los turnos citados";
    listen.addEventListener("click", e => {
      e.stopPropagation();
      select(row, line.cites, true);
      playTurns(line.cites);
    });
    meta.appendChild(listen);
  }
  if (line.patient_reported) meta.appendChild(el("span", "chip told", "💬 referido por el paciente"));
  if (line.action) meta.appendChild(el("span", "chip doc", ACTION_CHIP[line.action]));
  row.appendChild(meta);
  for (const issue of line.issues)
    row.appendChild(el("div", "issue " + issue.level + (line.action ? " resolved" : ""), issue.reason));

  const tools = el("div", "tools");
  if (line.action === "removed") {
    tools.appendChild(button("↶ Deshacer", "", () => setAction(line, null)));
  } else {
    tools.appendChild(button("✎ Editar", "", () => { editing = line.id; renderNote(); }));
    if (needsDecision(line))
      tools.appendChild(button("✔ Aceptar tal cual", "", () => setAction(line, "accepted")));
    if (line.action === "edited" || line.action === "accepted")
      tools.appendChild(button("↶ Deshacer", "", () => setAction(line, null)));
    tools.appendChild(button(line.added ? "Borrar" : "Quitar de la nota", "danger", () => {
      if (line.added) { model.splice(model.indexOf(line), 1); renderNote(); }
      else setAction(line, "removed");
    }));
  }
  if (!signed) meta.appendChild(tools);
  return row;
}

// ---- Sign-off: blocked until every 🔴 line is decided and every audio warning is reviewed ----
let signed = null;
let missingAck = false;

function blockers() {
  const out = [];
  const red = pendingRed();
  const gapsLeft = gapNodes.length - gapAcks.size;
  const missing = (caseData.verification.coverage_missing || []).length;
  if (editing) out.push("termina de editar la línea abierta");
  if (red) out.push(`${red} línea${red > 1 ? "s" : ""} 🔴 por resolver`);
  if (gapsLeft) out.push(`${gapsLeft} aviso${gapsLeft > 1 ? "s" : ""} de audio sin revisar`);
  if (missing && !missingAck) out.push("revisar lo que falta en la nota");
  return out;
}

function renderStatus() {
  const pill = document.getElementById("status");
  let label, cls;
  if (signed) [label, cls] = ["Firmada", "ready"];
  else if (pendingRed()) [label, cls] = ["Requiere corrección", "revise"];
  else if (blockers().length) [label, cls] = ["Revisar audio perdido", "gaps"];
  else [label, cls] = ["Lista para firmar", "ready"];
  pill.textContent = label;
  pill.className = "pill " + cls;
}

function renderSignBar() {
  renderStatus();
  const bar = document.getElementById("signbar");
  bar.replaceChildren();
  if (signed) {
    bar.className = "signbar signed";
    bar.appendChild(el("div", "", `✔ Firmada por ${signed.signed_by} · ${new Date(signed.signed_at).toLocaleString("es-MX")}`));
    bar.appendChild(el("div", "hash", "Huella SHA-256 de la nota: " + signed.note_sha256.slice(0, 16) + "…" +
                         (signed.saved ? " · guardada como " + signed.saved : "")));
    return;
  }
  const missing = blockers();
  bar.className = "signbar" + (missing.length ? " blocked" : " ready");
  bar.appendChild(el("div", "why", missing.length
    ? "Para firmar: " + missing.join(" · ")
    : "Todo revisado. Al firmar, la nota queda como tuya y se guarda con la transcripción de respaldo."));
  const form = el("div", "form");
  const name = el("input");
  name.id = "signer";
  name.placeholder = "Nombre del médico que firma";
  try { name.value = localStorage.getItem("kora.signer") || ""; } catch (e) {}
  const go = el("button", "sign", "Firmar nota");
  const update = () => { go.disabled = missing.length > 0 || !name.value.trim(); };
  name.addEventListener("input", update);
  go.addEventListener("click", () => sign(name.value.trim()));
  update();
  form.appendChild(name);
  form.appendChild(go);
  bar.appendChild(form);
}

async function sha256(text) {
  const bytes = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(bytes)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function finalNote() {
  const note = {};
  for (const [key] of SECTIONS) {
    note[key] = model.filter(l => l.section === key && l.action !== "removed").map(l => ({
      text: l.text,
      cites: l.cites,
      origin: l.action === "added" ? "clinician" : l.action === "edited" ? "model_edited" : "model",
    }));
  }
  return note;
}

async function sign(name) {
  if (blockers().length || !name) return;
  try { localStorage.setItem("kora.signer", name); } catch (e) {}
  const v = caseData.verification;
  const note = finalNote();
  const record = {
    case: caseData.case,
    signed_by: name,
    signed_at: new Date().toISOString(),
    note,
    note_sha256: await sha256(JSON.stringify(note)),
    transcript_sha256: await sha256(JSON.stringify(caseData.transcript)),
    verifier: { status: v.status, summary: v.summary, coverage_missing: v.coverage_missing || [],
                coverage_reviewed: missingAck },
    audit: model.map(l => ({
      id: l.id, section: l.section, proposed: l.added ? null : l.original, final: l.action === "removed" ? null : l.text,
      action: l.action || "kept", verifier_status: l.added ? null : l.status, issues: l.issues,
    })),
    audio_warnings: (v.transcript_gaps || []).map((g, i) => ({ ...g, reviewed: gapAcks.has(i) })),
  };
  let saved = null;
  try {
    const res = await fetch("sign", { method: "POST", headers: { "Content-Type": "application/json" },
                                      body: JSON.stringify(record) });
    if (res.ok) saved = (await res.json()).saved;
  } catch (e) {}
  if (!saved) {  // static demo without the server: hand the signed record over as a download
    const a = el("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(record, null, 2)], { type: "application/json" }));
    a.download = caseData.case + ".signed.json";
    a.click();
    saved = a.download + " (descargada)";
  }
  signed = { ...record, saved };
  editing = null;
  gapChecks.forEach(c => c.disabled = true);
  document.body.classList.add("is-signed");
  renderNote();
}

function renderNote() {
  const c = caseData;
  const box = document.getElementById("note");
  box.replaceChildren();
  activeLine = null;
  const missing = c.verification.coverage_missing || [];
  if (missing.length) {
    const warn = el("div", "banner missing" + (missingAck ? " done" : ""));
    warn.appendChild(el("div", "", "⚠ Falta en la nota: " + missing.join(", ") +
      ". Puede estar en audio que no se captó: revisa los avisos de la transcripción."));
    const label = el("label", "ack");
    const check = el("input");
    check.type = "checkbox";
    check.checked = missingAck;
    check.disabled = signed;
    check.addEventListener("change", () => { missingAck = check.checked; renderNote(); });
    label.appendChild(check);
    label.appendChild(el("span", "", "Revisado: lo agregué a la nota o no se mencionó en la consulta"));
    warn.appendChild(label);
    box.appendChild(warn);
  }
  for (const [key, title] of SECTIONS) {
    const sec = el("div", "section");
    const h = el("h3", "", key + " ");
    h.appendChild(el("span", "", title));
    sec.appendChild(h);
    const lines = model.filter(l => l.section === key);
    if (!lines.length) sec.appendChild(el("div", "empty", "Sin información dictada."));
    for (const line of lines) sec.appendChild(renderLine(line));
    if (!signed) sec.appendChild(button("＋ Agregar línea", "add", () => {
      const line = { id: key + "+" + (++addCount), section: key, text: "", original: "", cites: [],
                     issues: [], status: "added", action: "added", added: true };
      model.push(line);
      editing = line.id;
      renderNote();
    }));
    box.appendChild(sec);
  }
  renderCounts();
  renderSignBar();
}

function renderTranscript(c) {
  const box = document.getElementById("transcript");
  const names = speakerNames(c.transcript, c.verification.clinician_speaker);
  const gaps = c.verification.transcript_gaps || [];
  for (const turn of c.transcript) {
    const row = el("div", "turn");
    turnRows[turn.id] = row;
    const isDoctor = turn.speaker === c.verification.clinician_speaker;
    const who = el("div", "who " + (isDoctor ? "doctor" : "patient"), names[turn.speaker]);
    who.appendChild(el("small", "", clock(turn.start_ms)));
    row.appendChild(who);
    const body = el("div");
    if (hasAudio) {
      const btn = el("button", "play", "▶");
      btn.title = "Escuchar " + turn.id;
      btn.addEventListener("click", () => playTurns([turn.id]));
      body.appendChild(btn);
    }
    body.appendChild(el("span", "tid", turn.id));
    body.appendChild(el("span", "", turn.text));
    row.appendChild(body);
    box.appendChild(row);
    const i = c.transcript.indexOf(turn);
    gaps.forEach((gap, index) => {
      if (gap.after !== turn.id) return;
      const node = renderGap(gap, index, turn, c.transcript[i + 1]);
      gapNodes.push(node);
      box.appendChild(node);
    });
  }
  updateGapBanner();
  document.getElementById("gapBanner").addEventListener("click", () => {
    const first = gapNodes.find((n, k) => !n.classList.contains("done")) || gapNodes[0];
    if (!first) return;
    const panel = document.getElementById("tpanel");
    const top = panel.scrollTop + first.getBoundingClientRect().top - panel.getBoundingClientRect().top - 60;
    panel.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
  });
}

fetch("case.json").then(r => r.json()).then(c => {
  hasAudio = !!c.has_audio;
  for (const t of c.transcript) turnsById[t.id] = t;
  if (hasAudio) document.querySelector(".hint").textContent =
    "Clic en una línea para ver de qué turnos sale · ▶ para escucharlos · Esc para detener.";
  caseData = c;
  model = c.verification.lines.map(l => ({ ...l, original: l.text, action: null }));
  renderHeader(c);
  renderTranscript(c);
  renderNote();
});
</script>
